# Read by SonarCloud's automatic analysis. The test data is made-up code kept
# on purpose in odd shapes (identical branches, a missing go.sum, a page with
# an inline style) to test PathKit itself, and the corpus check is a CI script;
# neither is PathKit's own code, so neither is analysed.
sonar.exclusions=testdata/**,**/testdata/**,.github/corpus/**
