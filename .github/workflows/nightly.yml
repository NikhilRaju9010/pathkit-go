name: Nightly soundness and public corpus

# Long runs of the soundness test: 10,000 random programs from the fixed seeds and
# 10,000 from a new seed every night (printed in the log), with the fact
# engine's "cannot be tested" claims checked against what the programs really
# do. A second job runs PathKit on a public corpus (the Temporal Go samples,
# cloned at a pinned commit) and fails when the "could not fully read" panel
# grows over its stored baseline or a path a test ran is not testable (a false
# claim). Both run on Linux only, once a night and on demand. The normal CI
# workflow (ci.yml) is not changed by this file. No job here uses a secret.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The fixed seeds (1 to 5) are run every night, so a program that once failed
  # is looked at again; they include the programs listed in TestKnownPrograms.
  soundness-fixed-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            testdata/pilot/go.sum

      - name: Soundness test, fixed seeds (10,000 programs)
        env:
          PATHKIT_SOUNDNESS_N: "10000"
          PATHKIT_SOUNDNESS_SEEDS: "1,2,3,4,5"
        run: go test -timeout 80m -run TestNoFalseCannotBeTestedClaims -v ./internal/soundness

  # A new seed every night, on top of the fixed ones, so the test keeps looking at
  # programs nobody has run before. The seed is printed in the log and in the job
  # summary: to run the same programs again,
  #   PATHKIT_SOUNDNESS_SEED=<seed> PATHKIT_SOUNDNESS_N=10000 go test -run TestNoFalseCannotBeTestedClaims ./internal/soundness
  soundness-new-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            testdata/pilot/go.sum

      - name: Pick tonight's seed
        id: seed
        run: |
          # not one of the fixed seeds (1 to 5): the day number and the run number
          seed=$(( ( $(date -u +%s) / 86400 ) * 10 + ${GITHUB_RUN_NUMBER} % 10 + 100 ))
          echo "value=${seed}" >> "$GITHUB_OUTPUT"
          echo "Tonight's soundness seed: ${seed}"
          echo "Tonight's soundness seed: \`${seed}\` (repeat it with PATHKIT_SOUNDNESS_SEED=${seed} PATHKIT_SOUNDNESS_N=10000)" >> "$GITHUB_STEP_SUMMARY"

      - name: Soundness test, tonight's seed (10,000 programs)
        env:
          PATHKIT_SOUNDNESS_N: "10000"
          PATHKIT_SOUNDNESS_SEED: ${{ steps.seed.outputs.value }}
        run: go test -timeout 80m -run TestNoFalseCannotBeTestedClaims -v ./internal/soundness

  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # the public corpus and the commit it is pinned to (see .github/corpus/baseline.json)
      CORPUS_REPO: https://github.com/temporalio/samples-go
      CORPUS_COMMIT: e979e6ed40721a7561530c095b3f8899fbc84950
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build PathKit
        run: go build -o "$RUNNER_TEMP/pathkit" ./cmd/pathkit

      - name: Get the corpus at the pinned commit
        run: |
          git clone --quiet "$CORPUS_REPO" "$RUNNER_TEMP/corpus"
          git -C "$RUNNER_TEMP/corpus" checkout --quiet "$CORPUS_COMMIT"

      - name: Run PathKit on the corpus and compare with the baseline
        run: python3 .github/corpus/check.py "$RUNNER_TEMP/pathkit" "$RUNNER_TEMP/corpus" .github/corpus/baseline.json
