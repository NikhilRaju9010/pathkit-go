name: CI

on:
  push:
  pull_request:

# The jobs only read the code, so the token needs no write access.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # a stuck run stops after an hour, not after GitHub's six-hour default
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            testdata/pilot/go.sum

      - name: Check formatting (gofmt)
        shell: bash # the script is bash; Windows runners default to PowerShell
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: free memory (Linux)
        if: runner.os == 'Linux'
        run: free -m

      # On Linux the race run was ended by the runner (exit 143) with the
      # default parallelism, so it runs two packages at a time there.
      - name: go test (with race detector, Linux)
        if: runner.os == 'Linux'
        run: go test -race -p 2 -timeout 30m ./...

      - name: go test (with race detector)
        if: runner.os != 'Linux'
        run: go test -race -timeout 30m ./...

      # The pilot project (testdata/pilot) is a separate Go module, so the
      # commands above skip it. It is checked on its own here.
      - name: sample project — go vet
        working-directory: testdata/pilot
        run: go vet ./...

      - name: sample project — staticcheck
        working-directory: testdata/pilot
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: sample project — go test (with race detector)
        working-directory: testdata/pilot
        run: go test -race -timeout 30m ./...
