name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            testdata/pilot/go.sum

      - name: Check formatting (gofmt)
        shell: bash # the script is bash; Windows runners default to PowerShell
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: go test (with race detector)
        run: go test -race ./...

      # The pilot project (testdata/pilot) is a separate Go module, so the
      # commands above skip it. It is checked on its own here.
      - name: pilot — go vet
        working-directory: testdata/pilot
        run: go vet ./...

      - name: pilot — staticcheck
        working-directory: testdata/pilot
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: pilot — go test (with race detector)
        working-directory: testdata/pilot
        run: go test -race ./...
